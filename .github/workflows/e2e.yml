name: End-to-end

# Drives the production UI build against the real API and a seeded database,
# which neither the Mirage-backed UI tests nor the API tests do alone

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'ui/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'ui/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:latest
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout Github repo
        uses: actions/checkout@v7
      - name: Sets up an Erlang/OTP environment
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "28.5.0.4"
      - name: Cache mix dependencies
        id: mix-cache
        uses: actions/cache@v6
        with:
          path: |
            api/deps
            api/_build
          key: ${{ runner.os }}-mix-dev-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('api/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-dev-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - name: Install API dependencies
        if: steps.mix-cache.outputs.cache-hit != 'true'
        working-directory: api
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
          mix deps.compile
        env:
          MIX_ENV: dev

      - uses: jdx/mise-action@v5
        with:
          working_directory: e2e
      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Install end-to-end dependencies
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Build the UI
        working-directory: e2e
        run: pnpm build:ui
      - name: Reset the database with sandbox data
        working-directory: e2e
        run: pnpm reset-db
      - name: Run end-to-end tests
        working-directory: e2e
        run: pnpm test
        env:
          CI: true

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
