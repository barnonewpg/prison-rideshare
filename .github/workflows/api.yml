name: API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'

permissions:
  contents: read
  checks: write

concurrency:
  group: api-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: api

jobs:
  mix-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:latest
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout Github repo
        uses: actions/checkout@v4
      - name: Sets up an Erlang/OTP environment
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.14.0"
          otp-version: "25.3.2.20"
      - name: Cache mix dependencies
        id: mix-cache
        uses: actions/cache@v3
        with:
          path: |
            api/deps
            api/_build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('api/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - name: Install dependencies
        if: steps.mix-cache.outputs.cache-hit != 'true'
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
          mix deps.compile
      - name: Run Tests
        run: mix coveralls.github
        env:
          MIX_ENV: test
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: "API test results"
          files: api/_build/test/lib/prison_rideshare/test-junit-report.xml
