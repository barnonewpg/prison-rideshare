name: API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  schedule:
    # Catches advisories published against code nobody touched
    - cron: "0 9 * * 1"

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: api-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: api

jobs:
  deps-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Github repo
        uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          working_directory: api
      - name: Install dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - name: Audit dependencies for security advisories
        run: mix hex.audit

  mix-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:latest
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout Github repo
        uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          working_directory: api
      - name: Cache mix dependencies
        id: mix-cache
        uses: actions/cache@v6
        with:
          path: |
            api/deps
            api/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('api/mise.toml') }}-${{ hashFiles('api/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ hashFiles('api/mise.toml') }}-
      - name: Install dependencies
        if: steps.mix-cache.outputs.cache-hit != 'true'
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
          mix deps.compile
      - name: Run Tests
        run: mix coveralls.github
        env:
          MIX_ENV: test
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: "API test results"
          files: api/_build/test/lib/prison_rideshare/test-junit-report.xml
      # The test env alone would not catch a dev-only dependency that fails to compile
      - name: Check the dev build compiles cleanly
        if: always()
        run: mix compile --warnings-as-errors
        env:
          MIX_ENV: dev

  # The sandbox seeds otherwise only run locally and in the nightly sandbox reset
  sandbox-seeds:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    services:
      db:
        image: postgres:latest
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout Github repo
        uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          working_directory: api
      - name: Cache mix dependencies
        id: mix-cache
        uses: actions/cache@v6
        with:
          path: |
            api/deps
            api/_build
          key: ${{ runner.os }}-mix-dev-${{ hashFiles('api/mise.toml') }}-${{ hashFiles('api/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-dev-${{ hashFiles('api/mise.toml') }}-
      - name: Install dependencies
        if: steps.mix-cache.outputs.cache-hit != 'true'
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
          mix deps.compile
      - name: Create the database
        run: mix ecto.create
      - name: Reset the database with sandbox data
        run: mix reset_sandbox
      - name: Check every seeded version has an origin
        run: |
          mix run -e '
            import Ecto.Query
            untagged = PrisonRideshare.Repo.aggregate(from(v in PaperTrail.Version, where: is_nil(v.origin)), :count)
            if untagged > 0, do: raise "#{untagged} sandbox seed versions have no origin"
          '
