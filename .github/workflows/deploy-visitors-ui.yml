name: Deploy visitors UI

# Deploys the visitors branch's UI to the production branch of each visitors
# Pages project, so each is served at its stable project root.

on:
  workflow_dispatch:
  push:
    branches:
      - visitors
    paths:
      - 'ui/**'
      - '.github/workflows/deploy-visitors-ui.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: 'Deploy (${{ matrix.variant }})'
    if: github.ref == 'refs/heads/visitors'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: visitors
            project: prison-rideshare-preview-visitors
          - variant: visitors-sandbox
            project: prison-rideshare-preview-visitors-sandbox

    environment:
      name: preview-${{ matrix.variant }}
      url: https://${{ matrix.project }}.pages.dev

    concurrency:
      group: deploy-visitors-ui-${{ matrix.variant }}
      cancel-in-progress: true

    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          working_directory: ui
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          API_HOST: ${{ vars.API_HOST }}
          SOCKET_HOST: ${{ vars.SOCKET_HOST }}
        # Without API_HOST the production build enables Mirage.
        run: |
          if [ -z "$API_HOST" ]; then
            echo "::error::API_HOST is not set in the preview-${{ matrix.variant }} environment"
            exit 1
          fi
          pnpm exec ember build --environment=production
      # Wrangler 4 needs a newer Node than the app's pin.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ui/dist --project-name=${{ matrix.project }} --branch=visitors --commit-hash=${{ github.sha }} --commit-dirty=true
