name: UI

on:
  push:
    branches:
      - main
    paths:
      - 'ui/**'
      - '.github/workflows/ui.yml'
  pull_request:
    paths:
      - 'ui/**'
      - '.github/workflows/ui.yml'

concurrency:
  group: ui-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ui

jobs:
  lint:
    name: 'Lint'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: volta-cli/action@v4
        with:
          package-json-path: ui/package.json
      - uses: pnpm/action-setup@v2
        with:
          version: 10.30.1
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  test:
    name: 'Test'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: volta-cli/action@v4
        with:
          package-json-path: ui/package.json
      - uses: pnpm/action-setup@v2
        with:
          version: 10.30.1
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Tests
        run: pnpm test:ember:with-percy
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@170bf24d20d201b842d7a52403b73ed297e6645b # 2.18.0
        if: always()
        with:
          junit_files: ui/junit.xml
          check_name: UI test results
